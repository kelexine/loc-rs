name: "loc-rs Analysis"
description: "Advanced Lines of Code counter and complexity analyzer"
inputs:
  target_dir:
    description: "Directory to scan"
    required: false
    default: "."
  warn_size:
    description: "Trigger warnings if any file exceeds this line count"
    required: false
    default: ""
  functions:
    description: "Enable function extraction and complexity analysis"
    required: false
    default: "true"
  args:
    description: "Additional arguments to pass to loc-rs (e.g. --include-hidden, --git-dates)"
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - name: Install loc-rs
      shell: bash
      run: |
        cargo install loc-rs
    
    - name: Run loc-rs Scan
      shell: bash
      env:
        TARGET_DIR: ${{ inputs.target_dir }}
        WARN_SIZE: ${{ inputs.warn_size }}
        ENABLE_FUNCTIONS: ${{ inputs.functions }}
        EXTRA_ARGS: ${{ inputs.args }}
      run: |
        set -euo pipefail

        if [[ -z "${TARGET_DIR}" ]]; then
          echo "ERROR: target_dir cannot be empty" >&2
          exit 1
        fi

        if [[ -n "${WARN_SIZE}" ]] && ! [[ "${WARN_SIZE}" =~ ^[0-9]+$ ]]; then
          echo "ERROR: warn_size must be an integer" >&2
          exit 1
        fi

        cmd=(loc "${TARGET_DIR}")

        if [[ -n "${WARN_SIZE}" ]]; then
          cmd+=(--warn-size "${WARN_SIZE}")
        fi

        if [[ "${ENABLE_FUNCTIONS}" == "true" ]]; then
          cmd+=(-f --func-analysis)
        fi

        if [[ -n "${EXTRA_ARGS}" ]]; then
          read -r -a extra <<< "${EXTRA_ARGS}"
          cmd+=("${extra[@]}")
        fi

        echo "Running:" "${cmd[@]}"
        "${cmd[@]}"
